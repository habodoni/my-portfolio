<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var url = new URL(window.location.href);
          // If a "to" query exists (e.g. ?to=powerbuilding), convert it to a hash route
          var to = url.searchParams.get('to'); // e.g., "powerbuilding"
          if (to) {
            url.searchParams.delete('to');               // keep other params
            var rest = url.searchParams.toString();
            var newHash = '#/' + to + (rest ? ('?' + rest) : '');
            window.location.replace(url.origin + url.pathname + newHash);
            return;
          }
        } catch (e) {}
      })();
    </script>
